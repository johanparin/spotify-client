<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>Spotify compact controller</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="player" aria-label="Spotify compact controller">
      <header class="status-bar">
        <div class="context">
          <h1 id="context-name">Connecting…</h1>
          <p id="context-detail">Waiting for Spotify playback</p>
        </div>
        <div class="actions">
          <button id="open-playlists" type="button">P · Playlists</button>
        </div>
      </header>

      <div class="list-status">
        <span id="list-mode">—</span>
        <button id="reveal" type="button" hidden>
          Playing off-screen · F
        </button>
      </div>

      <div class="playback-controls" aria-label="Playback controls">
        <button
          id="previous"
          type="button"
          title="Previous track ([)"
          disabled
        >◀</button>
        <button id="toggle" type="button" disabled>Space · Play</button>
        <button
          id="next"
          type="button"
          title="Next track (])"
          disabled
        >▶</button>
        <button id="shuffle" type="button" disabled>Shuffle off</button>
        <button id="repeat" type="button" disabled>Repeat off</button>
        <select id="device" aria-label="Spotify Connect device" disabled>
          <option value="">No device</option>
        </select>
      </div>

      <div class="progress">
        <span id="progress-current">0:00</span>
        <input
          id="seek"
          type="range"
          min="0"
          max="0"
          value="0"
          step="1000"
          aria-label="Playback position"
          disabled
        >
        <span id="progress-duration">0:00</span>
      </div>

      <ol
        id="tracks"
        tabindex="0"
        aria-label="Tracks"
        role="listbox"
      ></ol>

      <footer>
        <span>↑/↓ or C-p/C-n select · Enter play · P playlists</span>
        <span id="connection" role="status">Connecting</span>
      </footer>
    </main>

    <dialog id="playlist-dialog">
      <form method="dialog" class="playlist-picker">
        <header>
          <h2>Playlists</h2>
          <button value="cancel" aria-label="Close">Esc</button>
        </header>
        <input
          id="playlist-search"
          type="search"
          placeholder="Filter playlists"
          autocomplete="off"
          aria-label="Filter playlists"
        >
        <ol id="playlists" aria-label="Available playlists"></ol>
        <p id="playlist-help" role="status">
          Type to filter · C-n/C-p or ↑/↓ · Enter play
        </p>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
