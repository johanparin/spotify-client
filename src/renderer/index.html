<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    >
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>Spotify compact controller</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <svg class="icon-definitions" aria-hidden="true">
      <symbol id="icon-previous" viewBox="0 0 24 24">
        <path d="M5 4h3v16H5zM19 5v14L9 12z"/>
      </symbol>
      <symbol id="icon-next" viewBox="0 0 24 24">
        <path d="M16 4h3v16h-3zM5 5v14l10-7z"/>
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24">
        <path d="M8 5l11 7-11 7z"/>
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M7 5h4v14H7zM14 5h4v14h-4z"/>
      </symbol>
      <symbol id="icon-shuffle" viewBox="0 0 24 24">
        <path d="M4 7h3c4 0 6 10 10 10h3M17 14l3 3-3 3M4 17h3c1.5 0 2.7-1.4 3.8-3M15 7h5M17 4l3 3-3 3"/>
      </symbol>
      <symbol id="icon-repeat" viewBox="0 0 24 24">
        <path d="M17 5l3 3-3 3M20 8H8a4 4 0 0 0-4 4M7 19l-3-3 3-3M4 16h12a4 4 0 0 0 4-4"/>
      </symbol>
    </svg>
    <main class="player" aria-label="Spotify compact controller">
      <header class="context-bar">
        <button
          id="open-playlists"
          class="context-button"
          type="button"
          title="Choose playlist"
          aria-label="Choose playlist"
        >
          <span id="context-name">Connecting…</span>
        </button>
        <label class="device-picker" title="Spotify Connect device">
          <select id="device" aria-label="Spotify Connect device" disabled>
            <option value="">No device</option>
          </select>
        </label>
        <span id="connection" role="status">Connecting</span>
      </header>

      <button
        id="reveal"
        class="now-playing"
        type="button"
        title="Reveal playing track"
        aria-label="Reveal playing track"
        hidden
      >
        <span id="now-title">Unknown track</span>
        <span id="now-artist">Unknown artist</span>
      </button>

      <div class="playback-controls" aria-label="Playback controls">
        <button
          id="shuffle"
          class="icon-button"
          type="button"
          title="Shuffle"
          aria-label="Shuffle"
          aria-pressed="false"
          disabled
        ><svg aria-hidden="true"><use href="#icon-shuffle"/></svg></button>
        <button
          id="previous"
          class="icon-button"
          type="button"
          title="Previous track ([)"
          aria-label="Previous track"
          disabled
        ><svg aria-hidden="true"><use href="#icon-previous"/></svg></button>
        <button
          id="toggle"
          class="play-button"
          type="button"
          title="Play"
          aria-label="Play"
          disabled
        ><svg aria-hidden="true"><use href="#icon-play"/></svg></button>
        <button
          id="next"
          class="icon-button"
          type="button"
          title="Next track (])"
          aria-label="Next track"
          disabled
        ><svg aria-hidden="true"><use href="#icon-next"/></svg></button>
        <button
          id="repeat"
          class="icon-button"
          type="button"
          title="Repeat"
          aria-label="Repeat"
          aria-pressed="false"
          disabled
        ><svg aria-hidden="true"><use href="#icon-repeat"/></svg></button>
      </div>

      <div class="progress">
        <span id="progress-current">0:00</span>
        <input
          id="seek"
          type="range"
          min="0"
          max="0"
          value="0"
          step="1000"
          aria-label="Playback position"
          disabled
        >
        <span id="progress-duration">0:00</span>
      </div>

      <div class="list-status">
        <span id="list-mode">—</span>
      </div>

      <ol
        id="tracks"
        tabindex="0"
        aria-label="Tracks"
        role="listbox"
      ></ol>

    </main>

    <dialog id="playlist-dialog">
      <form method="dialog" class="playlist-picker">
        <header>
          <h2>Playlists</h2>
          <button value="cancel" aria-label="Close">Esc</button>
        </header>
        <input
          id="playlist-search"
          type="search"
          placeholder="Filter playlists"
          autocomplete="off"
          aria-label="Filter playlists"
        >
        <ol id="playlists" aria-label="Available playlists"></ol>
        <p id="playlist-help" role="status">
          Type to filter · C-n/C-p or ↑/↓ · Enter play
        </p>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
